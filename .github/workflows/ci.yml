name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync --extra dev --frozen

      - name: Static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check

      - name: Execute notebooks in workshop order
        working-directory: notebooks
        run: |
          mkdir -p /tmp/packt-executed
          uv run jupyter nbconvert \
            --to notebook \
            --execute \
            --output-dir /tmp/packt-executed \
            --ExecutePreprocessor.timeout=900 \
            01_data.ipynb \
            02_features_labels.ipynb \
            03_model_training.ipynb \
            04_backtest.ipynb
